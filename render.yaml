services:
  - type: web
    name: lakshmanrekha-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8787
      # Must stay false on the deployed service: true lets any caller
      # override the source IP used for rate-limiting/scoring, bypassing
      # per-IP detection entirely. Flip to true only temporarily, in the
      # Render dashboard (not here), if you need to run the bundled traffic
      # generator against this deployed instance for a live demo — and
      # flip it back afterward.
      - key: ALLOW_SIMULATED_SOURCE_IP
        value: "false"
      - key: ALLOWED_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
